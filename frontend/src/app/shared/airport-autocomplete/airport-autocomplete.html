<div class="relative" (click)="stopProp($event)">
  <label
    class="absolute -top-2 left-2 inline-block bg-background-light px-1 text-xs font-medium text-text-muted-light dark:bg-background-dark dark:text-text-muted-dark z-10"
    [for]="inputId"
  >{{ label }}</label>

  <input
    [id]="inputId"
    [class]="inputClass"
    [placeholder]="placeholder"
    [(ngModel)]="query"
    (input)="onInput()"
    (focus)="onFocus()"
    autocomplete="off"
    type="text"
  />

  @if (isOpen) {
    <div class="absolute left-0 top-full z-50 mt-1 w-full min-w-[280px] rounded-xl border border-slate-200 bg-white shadow-xl overflow-hidden">
      @for (airport of results; track airport.code) {
        <button
          class="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0"
          (click)="select(airport)"
          type="button"
        >
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-slate-100 font-mono text-xs font-bold text-slate-700">
            {{ airport.code }}
          </span>
          <span class="flex flex-col min-w-0">
            <span class="text-sm font-semibold text-slate-800 truncate">{{ airport.city }}</span>
            <span class="text-xs text-slate-400 truncate">{{ airport.name }} · {{ airport.country }}</span>
          </span>
        </button>
      }
    </div>
  }
</div>
